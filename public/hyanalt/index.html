<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Зам, тээврийн яам — иргэний нисэхийн хяналт шалгалтын мэдээллийн сан">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9992;</text></svg>">
<title>Нисэхийн хяналтын сан</title>
<link rel="stylesheet" href="../assets/theme.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:var(--page-bg);background-attachment:fixed;color:var(--ink);font-family:var(--fb);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:14px 10px 18px}
.brand{padding:6px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.brand .mark{font-family:var(--fd);font-weight:700;font-size:11px;letter-spacing:.16em;color:var(--accent);text-transform:uppercase}
.brand .nm{font-family:var(--fd);font-weight:700;font-size:19px;line-height:1.15;margin-top:3px}
.brand .sub{font-size:10.5px;color:var(--ink-3);margin-top:4px;line-height:1.35}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;padding:8px 9px;border-radius:var(--r);cursor:pointer;color:var(--ink-2);font-size:13.5px}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav .ct{margin-left:auto;font-family:var(--fm);font-size:11px;color:var(--ink-3)}
.nav button[aria-current="true"] .ct{color:var(--accent-ink)}
.railfoot{margin-top:auto;padding:10px 9px 0;border-top:1px solid var(--line);font-size:11px;color:var(--ink-3);line-height:1.45}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--surface)}
.topbar h1{font-size:20px;font-weight:700}
.topbar .spacer{flex:1}
.wrap{padding:20px 24px 56px;max-width:1280px;width:100%}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .rail{border-right:0;border-bottom:1px solid var(--line)}
  .nav{flex-direction:row;flex-wrap:wrap}
  .nav button{width:auto}
  .nav .ct{margin-left:6px}
  .railfoot{display:none}
  .wrap,.topbar{padding-left:16px;padding-right:16px}
}

/* ---------- primitives ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel>header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel>header h2{font-size:14.5px;font-weight:700;letter-spacing:.02em}
.panel>header .hint{font-size:11.5px;color:var(--ink-3)}
.panel .body{padding:16px}
.grid{display:grid;gap:14px}
/* Grid-ийн нүд анхдагчаар агуулгынхаа өргөнөөс багасдаггүй тул өргөн хүснэгт
   бүхэл хуудсыг хэвтээ гүйлгэдэг байв. .tblwrap дотроо гүйх боломжийг өгнө. */
.grid>*,.split>*{min-width:0}
.eyebrow{font-family:var(--fd);font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:12px}

.btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line-strong);color:var(--ink);padding:6px 11px;border-radius:var(--r);cursor:pointer;font-size:13px}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600;line-height:1.6;white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.serious{background:var(--serious-soft);color:var(--serious)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.neutral{background:var(--surface-3);color:var(--ink-2)}
.chip.accent{background:var(--accent-soft);color:var(--accent-ink)}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.code{font-family:var(--fm);font-size:11.5px;background:var(--surface-3);color:var(--ink-2);padding:1px 6px;border-radius:3px;white-space:nowrap}

/* ---------- tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tile{background:var(--surface);padding:13px 15px;display:flex;flex-direction:column;gap:3px}
.tile .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-family:var(--fd);font-weight:700;color:var(--ink-3)}
.tile .v{font-family:var(--fd);font-size:27px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .n{font-size:11.5px;color:var(--ink-3);line-height:1.35}
.tile.alert .v{color:var(--crit)}
/* ---------- зочинд нуусан хэсэг (зөвхөн админд харагдана) ---------- */
.ghost{opacity:.58}
.panel.ghost{border-style:dashed}
.tile.ghost{background:var(--surface-2)}
.tiletog{align-self:flex-start;margin-top:7px;padding:1px 7px;font-size:11px}
.hidmark{font-size:9.5px;letter-spacing:.04em;text-transform:none;color:var(--warn);
  border:1px solid var(--warn);border-radius:99px;padding:0 5px;white-space:nowrap}
.banner>.btn{margin-left:auto;align-self:center;flex:none}
.dashrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;
  padding:8px 0;border-top:1px solid var(--line)}
.dashrow:first-child{border-top:0}
.dashrow .ord{display:flex;gap:4px}
.dashrow input[type=text]{width:100%;background:var(--surface);border:1px solid var(--line-strong);
  border-radius:var(--r);padding:5px 9px;font-size:13px;color:var(--ink)}
.dashrow .sw{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.tile.warnv .v{color:var(--warn)}
.tile.goodv .v{color:var(--good)}

/* ---------- tables ---------- */
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-family:var(--fd);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap;font-weight:700}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--surface-2)}
td.num,th.num{text-align:right;font-family:var(--fm);font-variant-numeric:tabular-nums}
tfoot td{font-weight:700;border-top:1px solid var(--line-strong);border-bottom:0;background:var(--surface-2)}

/* ---------- flight strip (CAP) ---------- */
.strips{display:flex;flex-direction:column;gap:6px}
.strip{display:grid;grid-template-columns:4px 1fr auto;gap:0;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.strip .bar{background:var(--ink-3)}
.strip.crit .bar{background:var(--crit)} .strip.warn .bar{background:var(--warn)}
.strip.serious .bar{background:var(--serious)} .strip.good .bar{background:var(--good)}
.strip .mid{padding:9px 12px;min-width:0}
.strip .r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.strip .ttl{font-weight:600;font-size:13.5px}
.strip .r2{color:var(--ink-3);font-size:11.5px;margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.strip .right{padding:9px 12px;display:flex;flex-direction:column;align-items:flex-end;gap:5px;justify-content:center;border-left:1px dashed var(--line);white-space:nowrap}

/* ---------- charts ---------- */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.sbar{display:flex;height:15px;border-radius:3px;overflow:hidden;background:var(--surface-3);gap:2px}
.sbar span{display:block}
.brow{display:grid;grid-template-columns:minmax(120px,1.1fr) 1fr 46px;gap:10px;align-items:center;padding:5px 0}
.brow .lbl{font-size:12.5px;color:var(--ink-2)}
.brow .tot{text-align:right;font-family:var(--fm);font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums}

.matrix{border-collapse:separate;border-spacing:2px}
.matrix td.cellx{background:var(--surface-2);border-radius:4px;height:52px;vertical-align:top;padding:5px;min-width:74px}
.matrix td.cellx.l1{background:var(--good-soft)} .matrix td.cellx.l2{background:var(--warn-soft)}
.matrix td.cellx.l3{background:var(--serious-soft)} .matrix td.cellx.l4{background:var(--crit-soft)}
.matrix .pin{display:inline-block;font-size:10.5px;font-weight:600;background:var(--surface);border:1px solid var(--line-strong);border-radius:3px;padding:1px 5px;margin:1px}
.matrix th{padding:4px 6px;font-size:10px}

/* ---------- forms ---------- */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-family:var(--fd);font-weight:700;color:var(--ink-3)}
.field input,.field select,.field textarea{background:var(--surface-2);border:1px solid var(--line-strong);border-radius:var(--r);padding:6px 8px;font-size:13px;width:100%}
.field textarea{min-height:64px;resize:vertical}
.field.wide{grid-column:1/-1}
select.inline,input.inline{background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:2px 5px;font-size:12.5px;max-width:120px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:var(--r);font-size:12.5px;line-height:1.5}
.banner.info{background:var(--accent-soft);color:var(--accent-ink)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.notes li{margin-bottom:6px;font-size:12.5px;color:var(--ink-2)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13px;z-index:80;box-shadow:var(--shadow)}

/* ---------- засварлах цонх ---------- */
.mask{position:fixed;inset:0;background:rgba(9,16,22,.55);z-index:60}
.modal{position:fixed;z-index:61;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(880px,calc(100vw - 28px));max-height:calc(100vh - 48px);display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 18px 50px rgba(9,16,22,.4)}
.modal>header{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line)}
.modal>header h2{font-size:15.5px;font-weight:700}
.modal .mbody{padding:16px 18px;overflow-y:auto}
.modal>footer{display:flex;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 10px 10px;flex-wrap:wrap}
.modal .field label{display:block}

/* ---------- бүртгэлийн хэрэгслийн мөр ---------- */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.srch{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:6px 10px;font-size:13px;min-width:min(300px,100%)}
.prog-track{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;min-width:70px}
.prog-track span{display:block;height:100%;background:var(--accent)}
/* ---------- эх тайлангийн бичвэр ---------- */
.rtext{border-top:1px solid var(--line)}
.rtext:first-of-type{border-top:0}
.rtext>summary{cursor:pointer;padding:9px 0;font-family:var(--fd);font-weight:700;font-size:12px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);list-style:none}
.rtext>summary::-webkit-details-marker{display:none}
.rtext>summary::before{content:"▸ ";color:var(--ink-3)}
.rtext[open]>summary::before{content:"▾ "}
.rtext>p{margin:0 0 8px;max-width:82ch;font-size:12.5px;line-height:1.6;color:var(--ink-2)}
.rtext>p:last-child{margin-bottom:12px}
</style>
</head>
<body>

<div class="shell">
  <aside class="rail">
    <div class="brand">
      <div class="mark">Зам, тээврийн яам</div>
      <div class="nm">Хяналтын сан</div>
      <div class="sub">Иргэний нисэхийн хяналт шалгалтын мэдээллийн сан</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="railfoot" id="railfoot">Ачаалж байна…</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <h1 id="viewTitle">Хяналтын самбар</h1>
      <span class="spacer"></span>
      <a class="btn sm" href="../" style="text-decoration:none">← Нүүр</a>
      <a class="btn sm" id="bookLink" href="../garyn-avlaga/" style="text-decoration:none" hidden>Гарын авлага</a>
      <span id="modeChip" class="chip neutral"><span class="dot"></span>Холбогдож байна</span>
      <button class="btn sm" id="refreshBtn" title="Сангаас дахин татах">↻ Шинэчлэх</button>
      <button class="btn sm" id="authBtn">Нэвтрэх</button>
      <button class="btn sm" id="exportBtn" hidden>CSV татах</button>
    </div>
    <div class="wrap" id="view"></div>
  </main>
</div>
<div id="modalHost"></div>
<div id="authHost"></div>

<script src="config.js"></script>
<script src="db.js"></script>

/* ---------- самбарын харагдацын тохиргоо ----------
   Хадгалсан утгыг анхны жагсаалттай тулгаж цэгцэлнэ: шинээр нэмэгдсэн хэсэг
   автоматаар гарч ирнэ, устсан хэсгийн үлдэгдэл хаягдана. */
function normDash(defs, saved){
  const out=[], seen=new Set();
  (Array.isArray(saved)?saved:[]).forEach(it=>{
    if(!it || seen.has(it.id)) return;
    const d=defs.find(x=>x.id===it.id); if(!d) return;
    seen.add(d.id);
    out.push({id:d.id, title:String(it.title||"").trim()||d.t, on:it.on!==false});
  });
  // Шинээр нэмэгдсэн хэсгийг сүүлд биш, анхны жагсаалт дахь байрандаа оруулна:
  // өмнөх хөршөө хадгалсан дараалалаас олоод түүний ард тавина.
  defs.forEach((d,i)=>{
    if(seen.has(d.id)) return;
    let at = 0;
    for(let k=i-1; k>=0; k--){
      const p = out.findIndex(x=>x.id===defs[k].id);
      if(p>=0){ at = p+1; break; }
    }
    out.splice(at, 0, {id:d.id, title:d.t, on:true});
    seen.add(d.id);
  });
  return out;
}
function dashCfg(){
  const raw = settings().dash || {};
  const views = normDash(VIEW_DEFS, raw.views);
  // Хуучин хувилбарын dash.guest талбарыг цэсний тохиргоо руу шилжүүлнэ
  if(!Array.isArray(raw.views) && raw.guest===false){
    const d=views.find(v=>v.id==="dash"); if(d) d.on=false;
  }
  return {views,
          blocks: normDash(DASH_BLOCKS, raw.blocks),
          tiles:  normDash(DASH_TILES,  raw.tiles)};
}

function findingsOf(orgId){
  const cut=new Date(); cut.setMonth(cut.getMonth()-settings().lookbackMonths);
  return state.findings.filter(f=>f.orgId===orgId &&
    (!f.raisedDate || new Date(f.raisedDate)>=cut));
}
function effStatus(f){
  if(f.status==="Хаагдсан"||f.closedDate) return "Хаагдсан";
  if(f.dueDate && f.dueDate < today()) return "Хугацаа хэтэрсэн";
  return f.status||"Нээлттэй";
}
function riskOf(o){
  const s=settings(), fs=findingsOf(o.id);
  let overdue=0,nc=0,rq=0;
  fs.forEach(f=>{ const st=effStatus(f);
    if(st==="Хугацаа хэтэрсэн") overdue++;
    if(f.kind==="Үл нийцэл") nc++; else rq++; });
  const compliance=Math.min(100, overdue*s.penalty.overdue + nc*s.penalty.nonconformity + rq*s.penalty.requirement);
  const hasC=o.complexity>0, hasM=o.msMaturity>0;
  const cx = hasC ? (o.complexity-1)/4*100 : null;
  const ms = hasM ? (5-o.msMaturity)/4*100 : null;
  const complete = hasC && hasM;
  const total = complete ? (s.weights.complexity*cx + s.weights.compliance*compliance + s.weights.maturity*ms) : null;
  let level=null, perYear=null;
  if(complete){
    const sorted=[...s.levels].sort((a,b)=>a.min-b.min);
    for(const l of sorted) if(total>=l.min){ level=l.name; perYear=l.perYear; }
  }
  let nextDue=null;
  if(o.lastInspection && perYear){
    const d=new Date(o.lastInspection); d.setMonth(d.getMonth()+Math.round(12/perYear));
    nextDue=d.toISOString().slice(0,10);
  }
  return {compliance, cx, ms, total, level, perYear, overdue, nc, rq, complete, nextDue, count:fs.length};
}

async function boot(){
  const db = await INEG_DB.connect();
  state.db = db;
  if(!db){
    state.ready=true; drawMode(); render(); return;
  }
  db.onAuth(()=>{ state.dashDraft=null; drawMode(); render(); });
  drawMode();
  // Нүүр хуудаснаас «Админаар нэвтрэх» гэж ирсэн бол цонхыг шууд нээнэ
  if(/[?&]admin=1/.test(location.search) && !db.user()){ state.authOpen=true; drawAuth(); }

  const bind=(path,key)=>db.collection(path).onSnapshot(snap=>{
    state[key]=snap.docs.map(d=>({id:d.id, ...d.data()}));
    state.ready=true; render();
  }, e=>{ console.warn(path,e.code); state.ready=true; render(); });
  bind("orgs","orgs"); bind("findings","findings"); bind("inspections","inspections");
  bind("certs","certs"); bind("plan","plan"); bind("regs","regs"); bind("actions","actions");
  bind("aircraft","aircraft");
  db.doc("meta/settings").onSnapshot(d=>{
    state.settings = d.exists ? {...DEFAULTS, ...d.data()} : DEFAULTS;
    render();
  }, ()=>{});
  state.ready=true; render();
}

function drawAuth(){
  const host=$("#authHost");
  if(!state.authOpen){ host.innerHTML=""; return; }
  host.innerHTML=`<div class="mask" data-a="closeAuth"></div>
    <div class="modal" style="width:min(420px,calc(100vw - 28px))" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <header><h2 id="authTitle">Админаар нэвтрэх</h2>
        <span class="spacer" style="flex:1"></span>
        <button class="btn sm" data-a="closeAuth" aria-label="Хаах">✕</button></header>
      <div class="mbody">
        <div class="form">
          <div class="field wide"><label for="au_mail">И-мэйл</label>
            <input id="au_mail" type="email" autocomplete="username" inputmode="email"></div>
          <div class="field wide"><label for="au_pass">Нууц үг</label>
            <input id="au_pass" type="password" autocomplete="current-password"></div>
        </div>
        <p class="small muted" style="margin:12px 0 0">Нэвтрээгүй үед бүх хүн өгөгдлийг <b>харах</b> боломжтой.
          Нэмэх, засах, устгах эрхийг зөвхөн нэвтэрсэн ажилтан эдэлнэ.</p>
        <p class="small" id="au_err" style="margin:10px 0 0;color:var(--crit)" hidden></p>
      </div>
      <footer>
        <span class="spacer" style="flex:1"></span>
        <button class="btn" data-a="closeAuth">Болих</button>
        <button class="btn primary" data-a="doSignIn">Нэвтрэх</button>
      </footer>
    </div>`;
  host.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>authAct(b.dataset.a));
  host.querySelector("#au_pass").addEventListener("keydown", e=>{ if(e.key==="Enter") authAct("doSignIn"); });
  host.querySelector("#au_mail").focus();
}
async function authAct(a){
  if(a==="closeAuth"){ state.authOpen=false; drawAuth(); return; }
  if(a==="doSignIn"){
    const mail=$("#au_mail").value.trim(), pass=$("#au_pass").value;
    const err=$("#au_err");
    if(!mail||!pass){ err.hidden=false; err.textContent="И-мэйл, нууц үгээ бөглөнө үү."; return; }
    const btn=document.querySelector('[data-a="doSignIn"]');
    btn.disabled=true; btn.textContent="Нэвтэрч байна…"; err.hidden=true;
    try{
      await state.db.signIn(mail, pass);
      state.authOpen=false; drawAuth(); toast("Нэвтэрлээ"); render();
    }catch(e){
      err.hidden=false;
      err.textContent = /invalid/i.test(e.message) ? "И-мэйл эсвэл нууц үг буруу байна." : e.message;
      btn.disabled=false; btn.textContent="Нэвтрэх";
    }
  }
}
function wErr(e){
  if(e && e.code==="permission-denied") return "Эрх хүрэхгүй байна — админаар нэвтэрнэ үү";
  return (e && e.message) ? e.message : "алдаа";
}
async function save(path, id, data){
  if(!state.db){ toast("Сан холбогдоогүй байна"); return false; }
  if(!state.canWrite){ toast("Засварлахын тулд нэвтэрнэ үү"); return false; }
  try{ await state.db.doc(path+"/"+id).set(data); return true; }
  catch(e){ toast("Хадгалж чадсангүй: "+wErr(e)); return false; }
}
async function patch(path, id, data){
  if(!state.canWrite){ toast("Засварлахын тулд нэвтэрнэ үү"); return false; }
  try{ await state.db.doc(path+"/"+id).update(data); return true; }
  catch(e){ toast("Хадгалж чадсангүй: "+wErr(e)); return false; }
}
async function remove(path,id){
  if(!state.canWrite){ toast("Засварлахын тулд нэвтэрнэ үү"); return; }
  try{ await state.db.doc(path+"/"+id).delete(); toast("Устгалаа"); }
  catch(e){ toast("Устгаж чадсангүй: "+wErr(e)); }
}

function stackedRow(label, parts, total){
  const max = Math.max(...parts.map(p=>p.max||0), 1);
  const w = (v)=> (v/max*100)+"%";
  return `<div class="brow">
    <div class="lbl">${esc(label)}</div>
    <div class="sbar" style="width:${(total/max*100).toFixed(1)}%">
      ${parts.map(p=>`<span style="width:${(p.v/total*100).toFixed(2)}%;background:${p.c}" title="${esc(p.n)}: ${p.v}"></span>`).join("")}
    </div>
    <div class="tot">${num(total)}</div></div>`;
}
function bars(rows, color){
  const max=Math.max(...rows.map(r=>r[1]),1);
  return rows.map(r=>`<div class="brow"><div class="lbl">${esc(r[0])}</div>
    <div class="sbar" style="width:${(r[1]/max*100).toFixed(1)}%"><span style="width:100%;background:${color}"></span></div>
    <div class="tot">${num(r[1])}</div></div>`).join("");
}

async function submitForm(){
  const {coll,id}=state.modal, sc=SCHEMA[coll];
  const raw=k=>{ const e=$("#fld_"+k); return e? e.value : ""; };
  const data={};
  for(const f of sc.fields){
    const s=raw(f.k).trim();
    if(f.req && !s) return toast(`“${f.l}” талбарыг бөглөнө үү`);
    if(f.t==="num"||f.t==="n5") data[f.k]= s===""?null:Number(s);
    else if(f.t==="list")       data[f.k]= s.split(",").map(x=>x.trim()).filter(Boolean);
    else                        data[f.k]= s===""?null:s;
  }
  if(coll==="findings"){
    if(data.status==="Хаагдсан" && !data.closedDate) data.closedDate=today();
    if(data.status!=="Хаагдсан") data.closedDate=null;
  }
  let rid=id;
  if(!rid){
    if(sc.manualId){
      rid=($("#fld__id")?.value||"").trim().replace(/[^A-Za-z0-9_\-.~:@+]/g,"-");
      if(!rid) return toast("ID-г бөглөнө үү");
      if(recordOf(coll,rid)) return toast("Ийм ID-тай бичлэг аль хэдийн байна");
    } else rid = sc.pfx+"-"+Date.now().toString(36)+Math.floor(Math.random()*900+100);
  }
  if(await save(coll, rid, data)){ toast(id?"Хадгаллаа":"Нэмэгдлээ"); closeForm(); }
}
async function deleteRec(){
  const {coll,id}=state.modal; if(!id) return;
  const sc=SCHEMA[coll];
  let extra="";
  if(coll==="orgs"){
    const n=state.findings.filter(f=>f.orgId===id).length
          + state.inspections.filter(i=>i.orgId===id).length
          + state.certs.filter(c=>c.orgId===id).length;
    if(n) extra=`\n\nЭнэ байгууллагад холбогдсон ${n} бичлэг байна. Тэдгээр нь устахгүй ч “—” болж харагдана.`;

function filterBar(coll, ph){

function applyFilter(coll, list, keys){
  const q=(state.filter[coll]||"").trim().toLowerCase();
  if(!q) return list;
  return list.filter(r=>keys.some(k=>{
    const v = typeof k==="function"? k(r) : r[k];
    return String(v==null?"":Array.isArray(v)?v.join(" "):v).toLowerCase().includes(q);
  }));
}

function viewDash(){
  const openF=state.findings.filter(f=>effStatus(f)!=="Хаагдсан");
  const overdue=state.findings.filter(f=>effStatus(f)==="Хугацаа хэтэрсэн");
  const risks=state.orgs.map(o=>({o, r:riskOf(o)}));
  const unrated=risks.filter(x=>!x.r.complete).length;
  const high=risks.filter(x=>x.r.level==="Өндөр"||x.r.level==="Дунд-өндөр").length;
  const needYear=risks.reduce((a,x)=>a+(x.r.perYear||0),0);
  const planned=state.plan.reduce((a,p)=>a+(+p.count||0),0);
  const expSoon=state.certs.filter(c=>c.expiryDate && days(c.expiryDate,today())>=0 && days(c.expiryDate,today())<=60).length;
  const expired=state.certs.filter(c=>c.expiryDate && days(c.expiryDate,today())<0).length;
  const rt=REPORT.inspections.reduce((a,d)=>a+d.planned+d.unplanned+d.docs,0);
  const adone=state.actions.filter(a=>a.status==="Хэрэгжсэн").length;

  const rank=s=>({"Хугацаа хэтэрсэн":0,"Нээлттэй":1,"Залруулж байгаа":2}[s]??9);
  const attention = [...openF].sort((a,b)=>{
    const d=rank(effStatus(a))-rank(effStatus(b));
    return d || (({"Ноцтой":0,"Дунд":1,"Бага":2}[a.severity]??3)-({"Ноцтой":0,"Дунд":1,"Бага":2}[b.severity]??3));
  }).slice(0,6);

  const cfg = dashCfg(), adm = state.canWrite;

  /* --- үзүүлэлтийн хайрцаг бүрийн агуулга (нэр нь тохиргооноос ирнэ) --- */
  const TILE = {
    orgs:  t=>tile(t,"",state.orgs.length, unrated?`${unrated}-д үнэлгээ дутуу`:"бүгд үнэлэгдсэн"),
    high:  t=>tile(t,high?"alert":"",high,"Өндөр + дунд-өндөр түвшин"),
    overdue:t=>tile(t,overdue.length?"alert":"",overdue.length,"залруулах арга хэмжээ"),
    open:  t=>tile(t,openF.length?"warnv":"goodv",openF.length,`нийт ${state.findings.length} бичлэгээс`),
    need:  t=>tile(t,"",needYear.toFixed(1),"эрсдэлээр тооцсон шалгалт"),
    certs: t=>tile(t,expired?"alert":(expSoon?"warnv":""),state.certs.length,
                   expired?`${expired} хугацаа дууссан`:(expSoon?`${expSoon} удахгүй дуусна`:"хүчинтэй")),
  };
  function tile(it, cls, value, note){
    return `<div class="tile ${cls}${it.on?"":" ghost"}">
      <div class="k">${esc(it.title)}${adm&&!it.on?` <span class="hidmark">нуусан</span>`:""}</div>
      <div class="v">${value}</div>
      <div class="n">${note}</div>
      ${adm?`<button class="btn sm tiletog" data-act="dashTile:${esc(it.id)}">${it.on?"Нуух":"Харуулах"}</button>`:""}
    </div>`;
  }

  /* --- самбарын хэсгүүд --- */
  const inspBody = () => `${REPORT.inspections.map(d=>{
      const tot=d.planned+d.unplanned+d.docs;
      const max=Math.max(...REPORT.inspections.map(x=>x.planned+x.unplanned+x.docs));
      return `<div class="brow"><div class="lbl">${esc(d.dept)}</div>
        <div class="sbar" style="width:${(tot/max*100).toFixed(1)}%">
          <span style="width:${(d.planned/tot*100).toFixed(2)}%;background:var(--s1)" title="Төлөвлөгөөт ${d.planned}"></span>
          <span style="width:${(d.unplanned/tot*100).toFixed(2)}%;background:var(--s2)" title="Төлөвлөгөөт бус ${d.unplanned}"></span>
          <span style="width:${(d.docs/tot*100).toFixed(2)}%;background:var(--s3)" title="Баримт бичгийн хяналт ${d.docs}"></span>
        </div><div class="tot">${tot}</div></div>`;
    }).join("")}
    <div class="legend">
      <span><i style="background:var(--s1)"></i>Төлөвлөгөөт 187</span>
      <span><i style="background:var(--s2)"></i>Төлөвлөгөөт бус 145</span>
      <span><i style="background:var(--s3)"></i>Баримт бичгийн хяналт 185</span>
    </div>`;

  const BLOCK = {
    tiles:{half:false, html:it=>{
      const list=cfg.tiles.filter(dashShow);
      return list.length? `<div class="tiles">${list.map(t=>TILE[t.id](t)).join("")}</div>` : "";
    }},
    attention:{half:true, hint:()=>`${overdue.length} хугацаа хэтэрсэн · ${openF.length} нээлттэй`,
      body:()=> attention.length
        ? `<div class="strips">${attention.map(stripHtml).join("")}</div>
           <p class="small muted" style="margin:12px 0 0">Бүрэн жагсаалтыг “Үл нийцэл, CAP” хэсгээс харна.</p>`
        : `<p class="muted small" style="margin:0">Нээлттэй үл нийцэл алга.</p>`},
    matrix:{half:true, hint:()=>"нарийн төвөгтэй байдал × нийцлийн түүх",
      body:()=> matrixHtml(risks)},
    inspections:{half:false, hint:()=>`эх тайлангийн үзүүлэлт · нийт ${num(rt)}`, body:inspBody},
    roadmap:{half:true, hint:()=>`${adone}/${state.actions.length} хэрэгжсэн`,
      body:()=> (state.actions.length
        ? [...state.actions].sort((a,b)=>(a.no??99)-(b.no??99)).slice(0,5).map(a=>`
          <div class="brow"><div class="lbl">${esc(a.title||"").slice(0,58)}${(a.title||"").length>58?"…":""}</div>
            <div class="prog-track"><span style="width:${Math.max(0,Math.min(100,+a.progress||0))}%"></span></div>
            <div class="tot">${+a.progress||0}%</div></div>`).join("")
        : `<p class="muted small" style="margin:0">Арга хэмжээ бүртгэгдээгүй.</p>`)
        + (state.actions.length>5?`<p class="small muted" style="margin:10px 0 0">Бүгдийг “Хэрэгжүүлэх арга хэмжээ” хэсгээс харна.</p>`:"")},
    regs:{half:true, hint:()=>`${state.regs.length} бичлэг`,
      body:()=> state.regs.length
        ? `<div class="strips">${[...state.regs]
            .sort((a,b)=>String(b.date||"").localeCompare(String(a.date||""))).slice(0,4).map(r=>`
            <div class="strip"><div class="bar" style="background:var(--accent)"></div>
              <div class="mid"><div class="r1"><span class="ttl">${esc(r.title||"—")}</span>
                ${r.ind?`<span class="code">${esc(r.ind)}</span>`:""}</div>
                <div class="r2"><span>${esc(r.issuer||"")}</span>
                  ${r.orderNo?`<span class="mono">${esc(r.orderNo)}</span>`:""}</div></div>
              <div class="right"><span class="small muted mono">${esc(r.date||"—")}</span></div></div>`).join("")}</div>`
        : `<p class="muted small" style="margin:0">Шинэчлэлт бүртгэгдээгүй.</p>`},
    usoap:{half:false, html:it=>`<div class="banner info${it.on?"":" ghost"}">
      <div><b>USOAP-CMA ${esc(REPORT.usoap.dates)}:</b> ${esc(REPORT.usoap.area)} чиглэлээр
      ${REPORT.usoap.pq} протокол асуулгад хамрагдаж <b>${REPORT.usoap.score}</b> оноо авсан.
      ${esc(REPORT.usoap.note)} ${REPORT.usoap.icvm.year} оны ICVM-ээр нэгдсэн EI
      <b>${REPORT.usoap.icvm.ei}%</b> байсан бөгөөд хамгийн сул элементүүд нь
      ${REPORT.usoap.icvm.weak.map(w=>`${w[0]} (${w[2]}%)`).join(", ")} байв.</div>
      ${adm?`<button class="btn sm" data-act="dashBlock:${esc(it.id)}">${it.on?"Нуух":"Харуулах"}</button>`:""}</div>`},
  };

  /* Хэсгийг самбарын хайрцагт хийнэ — админд нуух/харуулах товчтой */
  function blockHtml(it){
    const m=BLOCK[it.id]; if(!m) return "";
    if(m.html) return m.html(it);
    const hint=m.hint?m.hint():"";
    return `<section class="panel${it.on?"":" ghost"}">
      <header><h2>${esc(it.title)}</h2>
        ${hint?`<span class="hint">${hint}</span>`:""}
        ${adm?`<span style="flex:1"></span>
          ${it.on?"":`<span class="chip warn"><span class="dot"></span>Зочинд нуусан</span>`}
          <button class="btn sm" data-act="dashBlock:${esc(it.id)}">${it.on?"Нуух":"Харуулах"}</button>`:""}
      </header>
      <div class="body">${m.body()}</div></section>`;
  }

  /* Хагас өргөнтэй хоёр хэсгийг зэрэгцүүлж, бусдыг бүтэн мөрөөр байрлуулна */
  const parts=[]; let pair=[];
  const flush=()=>{ if(!pair.length) return;
    parts.push(pair.length===2?`<div class="split">${pair.join("")}</div>`:pair[0]); pair=[]; };
  cfg.blocks.filter(dashShow).forEach(it=>{
    const m=BLOCK[it.id]; if(!m) return;
    const h=blockHtml(it); if(!h) return;
    if(m.half){ pair.push(h); if(pair.length===2) flush(); }
    else { flush(); parts.push(h); }
  });
  flush();

  const dashOn = (cfg.views.find(v=>v.id==="dash")||{on:true}).on;
  const adminBar = adm ? `<div class="banner ${dashOn?"info":"warn"}">
    <div><b>Зочны харагдац:</b> ${dashOn
      ? "хяналтын самбар зочинд нээлттэй байна."

      нэр, дараалал, зочинд харагдахыг “Тохиргоо” хэсгээс өөрчил.</div>
    <button class="btn sm ${dashOn?"":"primary"}" data-act="dashGuest">${dashOn?"Зочинд хаах":"Зочинд нээх"}</button>
  </div>` : "";

  const empty = parts.length ? "" :
    `<div class="banner warn"><div>Самбарт харуулах хэсэг сонгогдоогүй байна.${
      adm?" “Тохиргоо” хэсгээс хэсгүүдийг буцааж асаана уу.":""}</div></div>`;

  return `<div class="grid">${adminBar}${empty}${parts.join("")}</div>`;
}
function stripHtml(f){
  const st=effStatus(f);
  const cls = st==="Хугацаа хэтэрсэн" ? "crit" : (f.severity==="Ноцтой"?"serious":(st==="Хаагдсан"?"good":"warn"));
  const od = f.dueDate ? days(today(), f.dueDate) : null;
  return `<div class="strip ${cls}">
    <div class="bar"></div>
    <div class="mid">
      <div class="r1">
        <span class="ttl">${esc(f.title||"—")}</span>
        <span class="chip ${f.kind==="Үл нийцэл"?"serious":"neutral"}">${esc(f.kind||"")}</span>
      </div>
      <div class="r2">
        <span>${esc(orgName(f.orgId))}</span>
        ${f.ind?`<span class="code">${esc(f.ind)}</span>`:""}
        ${f.clause?`<span class="mono">${esc(f.clause)}</span>`:""}
        ${f.reportNo?`<span class="mono">${esc(f.reportNo)}</span>`:""}
      </div>
    </div>
    <div class="right">
      <span class="chip ${st==="Хугацаа хэтэрсэн"?"crit":(st==="Хаагдсан"?"good":"warn")}">${esc(st)}</span>
      <span class="small muted mono">${f.dueDate? (od>0? od+" хоног хэтэрсэн" : "хугацаа "+f.dueDate) : "хугацаа тавиагүй"}</span>
    </div></div>`;
}
function matrixHtml(risks){
  const rated=risks.filter(x=>x.r.complete);
  const bands=[[0,25],[25,50],[50,75],[75,101]];
  const bandName=["0–25","25–50","50–75","75+"];
  const cells=[];
  for(let cy=3;cy>=0;cy--){
    const row=[];
    for(let cx=0;cx<4;cx++){
      const items=rated.filter(x=>{
        const a=x.r.cx, b=x.r.compliance;
        return a>=bands[cx][0]&&a<bands[cx][1]&&b>=bands[cy][0]&&b<bands[cy][1];
      });
      const lvl=Math.min(4, 1+Math.floor((cx+cy)/2));
      row.push(`<td class="cellx l${lvl}">${items.map(i=>`<span class="pin">${esc(i.o.short||i.o.name)}</span>`).join("")}</td>`);
    }
    cells.push(`<tr><th>${bandName[cy]}</th>${row.join("")}</tr>`);
  }
  const unrated=risks.filter(x=>!x.r.complete);
  return `<div class="tblwrap"><table class="matrix">
      <tr><th></th>${bandName.map(b=>`<th>${b}</th>`).join("")}</tr>
      ${cells.join("")}
    </table></div>
    <div style="display:flex;justify-content:space-between;gap:12px;margin-top:8px;flex-wrap:wrap">
      <span class="eyebrow">↑ Нийцлийн түүхийн эрсдэл</span>
      <span class="eyebrow">Нарийн төвөгтэй байдлын эрсдэл →</span>
    </div>
    <p class="small muted" style="margin:8px 0 0">Нийцлийн түүх нь ҮЛ НИЙЦЭЛ бүртгэлээс автоматаар тооцогдоно.</p>
    ${unrated.length?`<div class="banner warn" style="margin-top:10px">
      <div><b>${unrated.length} байгууллагад</b> нарийн төвөгтэй байдал эсвэл УТ-ны төлөвшилтийн үнэлгээ дутуу тул матрицад ороогүй:
      ${unrated.slice(0,10).map(x=>esc(x.o.short||x.o.name)).join(", ")}${
        unrated.length>10?` ба бусад ${unrated.length-10}`:""}.
      Үнэлгээг “Байгууллага, эрсдэл” хэсгээс оруулна.</div></div>`:""}`;
}

    const d=rank(effStatus(a))-rank(effStatus(b));

      <div class="tile goodv"><div class="k">Хаагдсан</div><div class="v">${counts["Хаагдсан"]||0}</div>
        <div class="n">${state.findings.length?Math.round((counts["Хаагдсан"]||0)/state.findings.length*100):0}% хэрэгжилт</div></div>
    </div>

    ${filterBar("findings","Гарчиг, заалт, байгууллага, тайлангийн дугаараар хайх…")}

    <section class="panel">
      <header><h2>Үл нийцэл, шаардлага ба залруулах төлөвлөгөө</h2>
        <span class="hint">${list.length} / ${state.findings.length} бичлэг · хугацаа хэтэрсэн нь эхэнд</span>
      </header>
      <div class="body" style="padding:0">
        <div class="tblwrap"><table>
          <thead><tr><th>Гарчиг</th><th>Байгууллага</th><th>ИНД / заалт</th><th>Төрөл</th><th>Ноцтой</th>
            <th>Илэрсэн</th><th>Хаах хугацаа</th><th>Статус</th>${state.canWrite?"<th></th>":""}</tr></thead>
          <tbody>${list.map(f=>{const st=effStatus(f);return `
            <tr>
              <td style="max-width:340px"><b>${esc(f.title||"—")}</b>
                ${f.desc?`<div class="small muted">${esc(f.desc).slice(0,190)}${(f.desc||"").length>190?"…":""}</div>`:""}
                ${f.srcNote?`<div class="small muted" style="margin-top:3px;font-style:italic">${esc(f.srcNote)}</div>`:""}</td>

              <td class="small"><span class="code">${esc(f.ind||"—")}</span>${f.clause?`<div class="mono muted small">${esc(f.clause)}</div>`:""}
                ${f.reportNo?`<div class="mono muted small">${esc(f.reportNo)}</div>`:""}</td>
              <td><span class="chip ${f.kind==="Үл нийцэл"?"serious":"neutral"}">${esc(f.kind||"")}</span></td>
              <td><span class="chip ${f.severity==="Ноцтой"?"crit":(f.severity==="Дунд"?"warn":"neutral")}">${esc(f.severity||"—")}</span></td>

    .forEach(c=>{ ntch[String(c.certNo||"").toUpperCase()]=c; });

    const d=days(c.expiryDate,today());
    return {t:d<0?"Хугацаа дууссан":(d<=60?"Удахгүй дуусна":"Хүчинтэй"),
            c:d<0?"crit":(d<=60?"warn":"good"), exp:c.expiryDate}; };

        <div class="n">МУ-д ${mn} · гадаадад ${fo}</div></div>
      <div class="tile ${soon?"warnv":""}"><div class="k">НТЧ 60 хоногт дуусна</div><div class="v">${soon}</div>
        <div class="n">сунгалт төлөвлөх</div></div>

        <div class="n">нислэгт гаргахгүй</div></div>

        <div class="n">гэрчилгээ эзэмшигчтэй холбогдсон</div></div>
    </div>
    ${filterBar("aircraft","Дугаар, маяг, оператороор хайх…")}

    <section class="panel">
      <header><h2>Агаарын хөлгийн бүртгэл</h2>
        <span class="hint">${list.length} / ${state.aircraft.length} мөр</span></header>

];

};
const INTL_SSC_AREA = Object.fromEntries(INTL_AREAS.map(a=>[a[1], a[2]]));

/* ICAO-гийн зөвлөмжөөр эрсдэлд суурилсан хяналтын босго 60% */
const intlLvl = v => v==null ? "neutral" : v>=80 ? "good" : v>=60 ? "warn" : "crit";
const intlPct = v => v==null ? "—" : v.toFixed(2)+"%";
const intlWhen = iso => { const d=new Date(iso); if(isNaN(d)) return "";
  const p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };

async function loadIntl(){
  if(state.intl.status!=="idle") return;
  state.intl = {...state.intl, status:"loading"}; render();
  const grab = async (url) => {
    const r = await fetch(url, {headers:{accept:"application/json"}});
    if(!r.ok) throw new Error(url+" → "+r.status);
    return r.json();
  };
  try{
    state.intl = {status:"ready", live:true, data:await grab("/api/intl"), msg:null};
  }catch(e){
    try{
      state.intl = {status:"ready", live:false, data:await grab("intl-snapshot.json"), msg:String(e.message||e)};
    }catch(e2){
      state.intl = {status:"error", live:false, data:null, msg:String(e2.message||e2)};
    }
  }
  render();
}

/* Жижиг шугаман график — гадны сан ашиглахгүй, SVG-ээр шууд зурна. */
function intlSpark(series, mark){
  const W=680, H=170, P={t:12,r:10,b:22,l:34};
  const all = series.flatMap(s=>s.pts).filter(p=>p[1]!=null);
  if(!all.length) return "";
  const xs = all.map(p=>p[0]), ys = all.map(p=>p[1]);
  const x0=Math.min(...xs), x1=Math.max(...xs);
  const y0=Math.max(0, Math.floor((Math.min(...ys)-6)/10)*10), y1=Math.min(100, Math.ceil((Math.max(...ys)+6)/10)*10);
  const px = x => P.l + (x-x0)/(x1-x0||1) * (W-P.l-P.r);
  const py = y => H-P.b - (y-y0)/(y1-y0||1) * (H-P.t-P.b);
  const grid = [y0, (y0+y1)/2, y1].map(y=>
    `<line x1="${P.l}" x2="${W-P.r}" y1="${py(y).toFixed(1)}" y2="${py(y).toFixed(1)}"
       stroke="var(--line)" stroke-width="1"/>
     <text x="${P.l-6}" y="${(py(y)+3.5).toFixed(1)}" text-anchor="end"
       font-size="10" fill="var(--ink-3)">${y.toFixed(0)}</text>`).join("");
  const lines = series.map(s=>{
    const d = s.pts.filter(p=>p[1]!=null).map((p,i)=>(i?"L":"M")+px(p[0]).toFixed(1)+" "+py(p[1]).toFixed(1)).join(" ");
    return `<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2"
              stroke-linejoin="round" stroke-linecap="round"/>`;
  }).join("");
  const dot = mark && mark.y>=y0 ? `<circle cx="${px(mark.x).toFixed(1)}" cy="${py(mark.y).toFixed(1)}" r="4.5"
      fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${(px(mark.x)+8).toFixed(1)}" y="${(py(mark.y)-7).toFixed(1)}" font-size="11"
      font-weight="700" fill="var(--accent-ink)">${esc(mark.t)}</text>` : "";
  const ticks = [x0, Math.round((x0+x1)/2), x1].map(x=>
    `<text x="${px(x).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${x}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img"
    aria-label="Үр дүнтэй хэрэгжилтийн олон жилийн чиг хандлага">
    ${grid}${lines}${dot}${ticks}</svg>
    <div class="legend">${series.map(s=>`<span><i style="background:${s.c}"></i>${esc(s.n)}</span>`).join("")}
      ${mark?`<span><i style="background:var(--accent)"></i>${esc(mark.n||mark.t)}</span>`:""}</div>`;
}

  return `<div class="prog-track" title="${v==null?"—":v.toFixed(2)+"%"}">

}

    </header>
    <div class="body">
      <div class="banner info" style="margin-bottom:14px">
        <div>Нэрийг нь шууд засаж, ↑↓ товчоор дарааллыг солино. Унтраасан хэсэг зочинд
        харагдахгүй боловч танд саарал өнгөөр харагдана. Өөрчлөлт
        <b>Харагдацыг хадгалах</b> дарсны дараа хүчинтэй.</div>
      </div>

      <div class="eyebrow" style="margin-bottom:4px">Цэсний хэсгүүд</div>
      ${d.views.map((it,i)=>row("views",it,i,d.views.length)).join("")}
      <p class="small muted" style="margin:8px 0 0">Унтраасан хэсэг зочны зүүн цэснээс
      бүрмөсөн алга болно. Админ нэвтэрсэн үед бүх хэсэг үргэлж харагдана.</p>

      <div class="eyebrow" style="margin:18px 0 4px">Самбарын үзүүлэлтийн хайрцаг</div>
      ${d.tiles.map((it,i)=>row("tiles",it,i,d.tiles.length)).join("")}

      <div class="eyebrow" style="margin:18px 0 4px">Самбарын хэсгүүд</div>
      ${d.blocks.map((it,i)=>row("blocks",it,i,d.blocks.length)).join("")}

      <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <button class="btn primary" data-act="saveDash">Харагдацыг хадгалах</button>
        ${dirty?`<button class="btn" data-act="dropDash">Өөрчлөлтийг болих</button>`:""}
        <button class="btn" data-act="resetDash">Анхны байдалд буцаах</button>
        ${dirty?`<span class="chip warn"><span class="dot"></span>Хадгалаагүй өөрчлөлт байна</span>`:""}
      </div>
    </div>
  </section>`;
}

/* ============================================================ үйлдэл */
function wire(){
  const root=$("#view");
  root.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>act(b.dataset.act));
  root.querySelectorAll("[data-new]").forEach(b=>b.onclick=()=>openForm(b.dataset.new));
  root.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{
    const [c,...rest]=b.dataset.edit.split("/"); openForm(c, rest.join("/"));
  });
  root.querySelectorAll("[data-srch]").forEach(el=>{
    let t=null;
    el.oninput=()=>{ clearTimeout(t); const c=el.dataset.srch, v=el.value;
      t=setTimeout(()=>{ state.filter[c]=v; render();
        const n=document.querySelector(`[data-srch="${c}"]`);
        if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } }, 220); };
  });
  root.querySelectorAll("[data-clr]").forEach(b=>b.onclick=()=>{ state.filter[b.dataset.clr]=""; render(); });
  root.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    const [c,i]=b.dataset.del.split("/");
    if(confirm("Энэ бичлэгийг устгах уу?")) remove(c,i);
  });
  root.querySelectorAll("[data-org]").forEach(el=>el.onchange=async()=>{
    const v=el.value===""?null:(el.type==="date"?el.value:+el.value);
    if(await patch("orgs", el.dataset.org, {[el.dataset.f]:v})) toast("Хадгаллаа");
  });
  root.querySelectorAll("[data-fnd]").forEach(el=>el.onchange=async()=>{
    const f=el.dataset.f; const patchObj={[f]: el.value||null};
    if(f==="status") patchObj.closedDate = el.value==="Хаагдсан" ? today() : null;
    if(await patch("findings", el.dataset.fnd, patchObj)) toast("Хадгаллаа");
  });
  root.querySelectorAll("[data-plan]").forEach(el=>el.onchange=async()=>{
    const v = el.dataset.f==="done" ? (el.value===""?null:+el.value) : (el.value||null);
    if(await patch("plan", el.dataset.plan, {[el.dataset.f]:v})) toast("Хадгаллаа");
  });
  root.querySelectorAll("[data-lvl]").forEach(el=>el.onchange=()=>{});
  // самбарын харагдац — нэр, харуулах эсэх (хадгалах хүртэл зөвхөн ноорогт)
  root.querySelectorAll("[data-dashttl]").forEach(el=>el.oninput=()=>{
    const it=dashItem(el.dataset.dashttl); if(it) it.title=el.value;
  });
  root.querySelectorAll("[data-dashon]").forEach(el=>el.onchange=()=>{
    const it=dashItem(el.dataset.dashon); if(it){ it.on=el.checked; render(); }
  });
}
/* "blocks:matrix" гэх мэт хаягаар ноорог дахь мөрийг олно */
function dashItem(key){
  const [kind,id]=String(key).split(":");
  const d=dashDraft();
  return (d[kind]||[]).find(x=>x.id===id) || null;
}
function dashMove(kind, id, dir){
  const d=dashDraft(), list=d[kind]||[];
  const i=list.findIndex(x=>x.id===id), j=i+dir;
  if(i<0 || j<0 || j>=list.length) return;
  list.splice(j,0,list.splice(i,1)[0]);
  render();
}
document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && state.modal) closeForm();
});

async function act(a){
  /* ---- хяналтын самбарын харагдац ---- */
  if(a.startsWith("dashTile:") || a.startsWith("dashBlock:")){
    // Самбар дээрээс шууд нуух/харуулах — тэр дороо хадгална
    const kind = a.startsWith("dashTile:") ? "tiles" : "blocks";
    const id = a.split(":")[1];
    const next = dashCfg();
    const it = next[kind].find(x=>x.id===id);
    if(!it) return;
    it.on = !it.on;
    if(await saveDash(next)){ state.dashDraft=null; toast(it.on?"Зочинд харуулна":"Зочинд харагдахгүй"); }
    return;
  }
  if(a==="dashGuest"){
    const next=dashCfg(), it=next.views.find(v=>v.id==="dash");
    if(!it) return;
    it.on=!it.on;
    if(!it.on && !confirm("Хяналтын самбарыг зочинд бүрэн хаах уу?\n\nНэвтрээгүй хүн энэ хэсгийг цэснээс ч харахгүй.")) return;
    if(await saveDash(next)){ state.dashDraft=null; toast(it.on?"Самбарыг зочинд нээлээ":"Самбарыг зочинд хаалаа"); }
    return;
  }
  if(a.startsWith("dashUp:"))   { const [,k,id]=a.split(":"); return dashMove(k,id,-1); }
  if(a.startsWith("dashDown:")) { const [,k,id]=a.split(":"); return dashMove(k,id, 1); }
  if(a==="dropDash"){ state.dashDraft=null; render(); toast("Өөрчлөлтийг болилоо"); return; }
  if(a==="saveDash"){
    const d=dashDraft();
    const clean=x=>({id:x.id, title:String(x.title||"").trim(), on:!!x.on});
    const next={views:d.views.map(clean), blocks:d.blocks.map(clean), tiles:d.tiles.map(clean)};
    if(!next.views.some(v=>v.on) && !confirm("Зочинд нэг ч хэсэг харагдахгүй болно.\n\nҮргэлжлүүлэх үү?")) return;
    if(await saveDash(next)){ state.dashDraft=null; toast("Харагдацыг хадгаллаа"); render(); }
    return;
  }
  if(a==="resetDash"){
    if(!confirm("Самбарын нэр, дараалал, харагдацыг анхны байдалд буцаах уу?")) return;
    if(await saveDash(dashDefaults())){ state.dashDraft=null; toast("Анхны байдал сэргээлээ"); render(); }
    return;
  }
  if(a==="closeForm") return closeForm();
  if(a==="submitForm") return submitForm();
  if(a==="deleteRec") return deleteRec();
  if(a==="autoDue"){
    const rule=settings().dueDays||DEFAULTS.dueDays;
    const targets=state.findings.filter(f=>!f.dueDate && f.raisedDate && effStatus(f)!=="Хаагдсан");
    if(!targets.length) return toast("Хугацаа тавих шаардлагатай нээлттэй бичлэг алга");
    if(!confirm(`${targets.length} нээлттэй бичлэгт ноцтой байдлын дүрмээр хаах хугацаа тавих уу?\n\n`+
      `Ноцтой ${rule["Ноцтой"]} хоног · Дунд ${rule["Дунд"]} хоног · Бага ${rule["Бага"]} хоног\n`+
      `(илэрсэн огнооноос тоолно; гараар дарж бичсэн хугацааг хөндөхгүй)`)) return;
    let n=0;
    for(const f of targets){
      const d=new Date(f.raisedDate); d.setDate(d.getDate()+(rule[f.severity]??rule["Дунд"]));
      if(await patch("findings", f.id, {dueDate:d.toISOString().slice(0,10)})) n++;
    }
    toast(`${n} бичлэгт хугацаа тавилаа`);
    return;
  }
  if(a==="saveCfg"){
    const cx=+($("#w_cx").value||0), co=+($("#w_co").value||0), ms=+($("#w_ms").value||0);
    if(cx+co+ms!==100) return toast("Жингийн нийлбэр 100% байх ёстой (одоо "+(cx+co+ms)+"%)");
    const levels=[...settings().levels].map(l=>{
      const mn=$(`[data-lvl="${CSS.escape(l.name)}"][data-f="min"]`);
      const py=$(`[data-lvl="${CSS.escape(l.name)}"][data-f="perYear"]`);
      return {name:l.name, min:mn?+mn.value:l.min, perYear:py?+py.value:l.perYear};
    });
    // Самбарын харагдац зэрэг бусад утгыг дарж бичихгүйн тулд эхлээд хуулна
    const ok=await save("meta","settings",{...settings(),
      weights:{complexity:cx/100,compliance:co/100,maturity:ms/100},
      penalty:{overdue:+$("#p_od").value, nonconformity:+$("#p_nc").value, requirement:+$("#p_rq").value},
      lookbackMonths:+$("#p_lb").value, levels,
      dueDays:{"Ноцтой":+$("#d_hi").value, "Дунд":+$("#d_md").value, "Бага":+$("#d_lo").value}});
    if(ok) toast("Тохиргоог хадгаллаа");
    return;
  }
  if(a==="resetCfg"){
    // Энэ товч зөвхөн эрсдэлийн загварт хамаарна — самбарын харагдацыг хөндөхгүй
    if(await save("meta","settings",{...DEFAULTS, dash:dashCfg()})) toast("Анхны утга сэргээлээ");
    return;
  }
}

/* ---------- CSV ---------- */
$("#exportBtn").onclick=()=>{
  const x=state.exportRows; if(!x) return;
  const q=v=>{const s=v==null?"":String(v); return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  // Excel-д кирилл үсэг зөв гарахын тулд BOM, талбар тусгаарлагчид цэгтэй таслал.
  const csv="﻿"+[x.head.map(q).join(";"), ...x.rows.map(r=>r.map(q).join(";"))].join("\r\n");
  try{
    const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
    const a=document.createElement("a");
    a.href=url; a.download=`ineg_${x.name}_${today()}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }catch(e){ toast("Татаж чадсангүй"); }
};

/* ---------- толгойн товчнууд ---------- */
$("#authBtn").onclick=async()=>{
  if(!state.db) return;
  if(state.db.user()){
    if(!confirm("Системээс гарах уу? Үүний дараа зөвхөн харах эрхтэй болно.")) return;
    await state.db.signOut(); toast("Гарлаа"); render();
  } else { state.authOpen=true; drawAuth(); }
};
$("#refreshBtn").onclick=async()=>{
  if(!state.db) return;
  const b=$("#refreshBtn"); b.disabled=true;
  try{ await state.db.refresh(); toast("Шинэчиллээ"); }
  finally{ b.disabled=false; }
};
document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && state.authOpen) authAct("closeAuth");
});

drawNav(); render(); boot();
